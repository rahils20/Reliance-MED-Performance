name: Build Desktop Executable

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas numpy python-docx altair gspread oauth2client scikit-learn xgboost joblib Pillow
        pip install pyinstaller pywebview streamlit

    - name: Build Executable with PyInstaller
      run: |
        pyinstaller --noconfirm --onedir --windowed --name "RO_Projection_Engine" --copy-metadata streamlit --collect-all streamlit --collect-all altair run_app.py

    - name: Upload Executable Artifact
      uses: actions/upload-artifact@v4
      with:
        name: RO_Projection_Engine_Windows
        path: dist/RO_Projection_Engine/*
