name: Build Cross-Platform Desktop Executables

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest]

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas numpy python-docx altair gspread oauth2client scikit-learn xgboost joblib Pillow
        pip install pyinstaller streamlit

    - name: Build Windows Executable
      if: runner.os == 'Windows'
      run: |
        pyinstaller --noconfirm --onedir --windowed --name "RO_Projection_Engine_Win" --add-data "streamlit_app.py;." --copy-metadata streamlit --collect-all streamlit --collect-all altair run_app.py

    - name: Build macOS Application
      if: runner.os == 'macOS'
      run: |
        pyinstaller --noconfirm --onedir --windowed --name "RO_Projection_Engine_Mac" --add-data "streamlit_app.py:." --copy-metadata streamlit --collect-all streamlit --collect-all altair run_app.py

    - name: Upload Windows Artifact
      if: runner.os == 'Windows'
      uses: actions/upload-artifact@v4
      with:
        name: RO_Projection_Engine_Windows
        path: dist/RO_Projection_Engine_Win/*

    - name: Upload macOS Artifact
      if: runner.os == 'macOS'
      uses: actions/upload-artifact@v4
      with:
        name: RO_Projection_Engine_macOS
        path: dist/RO_Projection_Engine_Mac.app/*
